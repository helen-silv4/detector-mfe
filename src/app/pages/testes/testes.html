<div class="p-8 grid grid-cols-3 gap-4">
  <div class="border border-green-500 rounded-lg p-4">
    <h2 class="font-bold mb-2">Teste de Voo</h2>
    <button
      (click)="executarTesteVoo()"
      [disabled]="carregandoVoo()"
      class="bg-green-500 text-black px-4 py-2 rounded disabled:opacity-50 disabled:cursor-not-allowed"
    >
      {{ carregandoVoo() ? 'Executando...' : 'Executar' }}
    </button>
    <pre class="bg-black text-green-400 text-xs p-2 mt-2 rounded">{{ logsVoo().join('\n') }}</pre>
  </div>

  <div class="border border-green-500 rounded-lg p-4">
    <h2 class="font-bold mb-2">Teste de Vídeo</h2>
    <button
      (click)="executarTesteVideo()"
      [disabled]="carregandoVideo()"
      class="bg-green-500 text-black px-4 py-2 rounded disabled:opacity-50 disabled:cursor-not-allowed"
    >
      {{ carregandoVideo() ? 'Executando...' : 'Executar' }}
    </button>
    <pre class="bg-black text-green-400 text-xs p-2 mt-2 rounded">{{ logsVideo().join('\n') }}</pre>
  </div>

  <div class="border border-green-500 rounded-lg p-4">
    <h2 class="font-bold mb-2">Voo + Vídeo</h2>
    <button
      (click)="executarTesteVooVideo()"
      [disabled]="carregandoVooVideo()"
      class="bg-green-500 text-black px-4 py-2 rounded disabled:opacity-50 disabled:cursor-not-allowed"
    >
      {{ carregandoVooVideo() ? 'Executando...' : 'Executar' }}
    </button>
    <pre class="bg-black text-green-400 text-xs p-2 mt-2 rounded">{{ logsVooVideo().join('\n') }}</pre>
  </div>
</div>
