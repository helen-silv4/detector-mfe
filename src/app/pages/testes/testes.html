<div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
  <div class="flex flex-col gap-4 lg:col-span-2">
    <div>
      <h2 class="text-xs font-bold uppercase tracking-widest text-gray-300">Rotinas Automáticas</h2>
      <p class="mt-1 text-xs text-gray-500">Ferramentas de desenvolvimento para validar voo, vídeo e integração do drone.</p>
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3">
      <app-routine-card
        icon="plane"
        title="Teste de Voo"
        description="Executa uma rotina básica de decolagem, deslocamento e pouso."
        [loading]="carregandoVoo()"
        [logs]="logsVoo()"
        (run)="executarTesteVoo()"
      ></app-routine-card>

      <app-routine-card
        icon="video"
        title="Teste de Vídeo"
        description="Valida a transmissão de vídeo e a qualidade do stream em tempo real."
        [loading]="carregandoVideo()"
        [logs]="logsVideo()"
        (run)="executarTesteVideo()"
      ></app-routine-card>

      <app-routine-card
        icon="drone"
        title="Voo e Vídeo"
        description="Combina voo e transmissão simultânea para teste de integração completo."
        [loading]="carregandoVooVideo()"
        [logs]="logsVooVideo()"
        (run)="executarTesteVooVideo()"
      ></app-routine-card>
    </div>
  </div>

  <app-telemetry-panel class="lg:col-span-1"></app-telemetry-panel>
</div>
