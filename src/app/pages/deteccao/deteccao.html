<div class="flex flex-col gap-6">
  <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
    <div class="relative aspect-video w-full overflow-hidden rounded-xl border border-border-subtle bg-[#0a0a0a] lg:col-span-2">
      <div
        class="absolute inset-0 opacity-[0.06]"
        style="background-image: linear-gradient(rgba(16,185,129,0.6) 1px, transparent 1px), linear-gradient(90deg, rgba(16,185,129,0.6) 1px, transparent 1px); background-size: 32px 32px;"
      ></div>

      <div class="absolute inset-x-0 top-0 z-10 flex items-center justify-between gap-2 p-3">
        <button
          type="button"
          (click)="toggleConnection()"
          class="group flex items-center gap-2 rounded-full border border-white/10 bg-black/50 px-3 py-1.5 text-xs font-semibold text-gray-200 backdrop-blur transition-colors duration-300 hover:border-neon-500/60"
        >
          <span
            class="h-2.5 w-2.5 rounded-full transition-shadow duration-300"
            [class]="
              telemetryService.telemetry().connected
                ? 'bg-neon-bright shadow-[0_0_8px_3px_rgba(0,255,0,0.55)]'
                : 'bg-red-500 shadow-[0_0_8px_3px_rgba(239,68,68,0.45)]'
            "
          ></span>
          {{ telemetryService.telemetry().connected ? 'Conectado' : 'Desconectado' }}
          <app-icon name="power" class="h-3.5 w-3.5 text-gray-500 transition-colors group-hover:text-neon-400"></app-icon>
        </button>

        @if (telemetryService.telemetry().connected) {
          <div class="flex items-center gap-2">
            <span
              class="flex items-center gap-1.5 rounded-full border border-white/10 bg-black/50 px-3 py-1.5 text-xs font-semibold text-gray-200 backdrop-blur"
            >
              <app-icon name="battery" class="h-4 w-4 text-neon-400"></app-icon>
              {{ telemetryService.telemetry().battery | number: '1.0-0' }}%
            </span>
            <span
              class="flex items-center gap-1.5 rounded-full border border-white/10 bg-black/50 px-3 py-1.5 text-xs font-semibold text-gray-200 backdrop-blur"
            >
              <app-icon name="thermometer" class="h-4 w-4 text-neon-400"></app-icon>
              {{ telemetryService.telemetry().temperature | number: '1.0-0' }}°C
            </span>
          </div>
        }
      </div>

      <div class="flex h-full flex-col items-center justify-center gap-3 text-gray-600">
        <span class="flex h-16 w-16 items-center justify-center rounded-full border border-dashed border-gray-700">
          <app-icon name="camera" class="h-8 w-8"></app-icon>
        </span>
        <p class="text-sm font-medium tracking-wide text-gray-500">Aguardando conexão de vídeo...</p>
      </div>

      <div class="pointer-events-none absolute inset-3 rounded-lg border border-white/5"></div>
    </div>

    <app-telemetry-panel class="lg:col-span-1"></app-telemetry-panel>
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <button
      type="button"
      class="group flex items-center justify-center gap-3 rounded-xl border-2 border-neon-500 bg-transparent px-6 py-5 text-base font-bold tracking-wide text-neon-400 transition-all duration-300 hover:bg-neon-500/10 hover:shadow-[0_0_24px_rgba(16,185,129,0.35)] active:scale-[0.98]"
    >
      <app-icon name="map" class="h-5 w-5 transition-transform duration-300 group-hover:scale-110"></app-icon>
      Mapeamento 2D
    </button>

    <button
      type="button"
      class="group flex items-center justify-center gap-3 rounded-xl border-2 border-neon-500 bg-neon-500 px-6 py-5 text-base font-bold tracking-wide text-black transition-all duration-300 hover:bg-neon-400 hover:shadow-[0_0_24px_rgba(16,185,129,0.55)] active:scale-[0.98]"
    >
      <app-icon name="trash" class="h-5 w-5 transition-transform duration-300 group-hover:scale-110"></app-icon>
      Detecção de Lixo
    </button>
  </div>
</div>
