<div class="min-h-screen bg-[#121212] p-6 text-white font-sans">
    <header class="mb-6 border-b border-gray-800 pb-4">
        <h1 class="text-3xl font-bold text-[#10B981]">Inspeção Ambiental Autônoma</h1>
        <p class="text-gray-400 text-sm mt-1">Telemetria e Visão Computacional (YOLOv8)</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Monitor Principal de Vídeo -->
        <div
            class="col-span-2 bg-[#1E1E1E] rounded-xl border border-gray-700 overflow-hidden shadow-lg shadow-[#10B981]/10">
            <div class="p-3 bg-gray-900 border-b border-gray-700 flex justify-between items-center">
                <h2 class="text-sm font-semibold flex items-center gap-2 text-gray-300">
                    <span class="w-2.5 h-2.5 rounded-full bg-[#10B981] animate-pulse"></span>
                    Câmera Frontal - DJI Tello
                </h2>
            </div>

            <div class="relative w-full aspect-video bg-black flex items-center justify-center">
                @if (!streamError) {
                    <!-- Puxando o MJPEG do FastAPI -->
                    <img [src]="streamUrl" (error)="onStreamError()" alt="Feed do Drone"
                        class="w-full h-full object-contain" />
                } @else {
                    <!-- Tela de Espera -->
                    <div class="text-gray-500 flex flex-col items-center">
                        <svg class="w-12 h-12 mb-3 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z">
                            </path>
                        </svg>
                        <p class="text-sm uppercase tracking-widest">Aguardando Conexão de Vídeo...</p>
                    </div>
                }
            </div>
        </div>

        <!-- Painel de Controle Lateral -->
        <div class="bg-[#1E1E1E] rounded-xl border border-gray-700 p-5 flex flex-col justify-center">
            <h3 class="text-lg font-bold text-white mb-6 border-b border-gray-700 pb-2">Comandos da Missão</h3>

            <button
                type="button"
                (click)="decolarEInspecionar()"
                class="w-full py-4 mb-4 bg-[#10B981] hover:bg-[#059669] text-black font-bold rounded-lg transition-all transform hover:scale-105 active:scale-95 shadow-md shadow-[#10B981]/20 cursor-pointer">
                DECOLAR E INSPECIONAR
            </button>

            <button
                type="button"
                (click)="pousoEmergencia()"
                class="w-full py-4 border border-red-500 hover:bg-red-500/10 text-red-500 font-bold rounded-lg transition-all active:scale-95 cursor-pointer">
                POUSO DE EMERGÊNCIA
            </button>
        </div>
    </div>
</div>
