@switch (name) {

  }
  @case ('battery') {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">

    </svg>
  }
  @case ('video') {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">

  @case ('drone') {

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 3.5v7" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M7 6.2a7.5 7.5 0 1 0 10 0" stroke-linecap="round" stroke-linejoin="round" />

  @case ('check') {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M4.5 12.5 9.5 17.5 19.5 6.5" stroke-linecap="round" stroke-linejoin="round" />
