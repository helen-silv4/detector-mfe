<div class="h-full rounded-xl border border-border-subtle bg-panel p-4 shadow-[inset_0_1px_0_rgba(255,255,255,0.03)]">
  <div class="mb-3 flex items-center gap-2">
    <span class="h-1.5 w-1.5 rounded-full bg-neon-500"></span>
    <h3 class="text-xs font-bold uppercase tracking-widest text-gray-300">Telemetria de Voo</h3>
  </div>

  <div class="flex flex-col gap-2">
    <div class="flex items-center justify-between rounded-lg border border-border-subtle bg-black/25 px-3 py-2.5">
      <div class="flex items-center gap-2 text-gray-400">
        <app-icon name="gauge" class="h-4 w-4 text-neon-400"></app-icon>
        <span class="text-xs font-medium uppercase tracking-wide">Altitude</span>
      </div>
      <span class="font-mono text-sm font-semibold text-gray-100">
        {{ telemetryService.telemetry().altitude | number: '1.1-1' }}
        <span class="ml-1 text-xs font-normal text-gray-500">m</span>
      </span>
    </div>

    <div class="flex items-center justify-between rounded-lg border border-border-subtle bg-black/25 px-3 py-2.5">
      <div class="flex items-center gap-2 text-gray-400">
        <app-icon name="compass" class="h-4 w-4 text-neon-400"></app-icon>
        <span class="text-xs font-medium uppercase tracking-wide">Latitude</span>
      </div>
      <span class="font-mono text-sm font-semibold text-gray-100">{{
        telemetryService.telemetry().latitude | number: '1.6-6'
      }}</span>
    </div>

    <div class="flex items-center justify-between rounded-lg border border-border-subtle bg-black/25 px-3 py-2.5">
      <div class="flex items-center gap-2 text-gray-400">
        <app-icon name="compass" class="h-4 w-4 text-neon-400"></app-icon>
        <span class="text-xs font-medium uppercase tracking-wide">Longitude</span>
      </div>
      <span class="font-mono text-sm font-semibold text-gray-100">{{
        telemetryService.telemetry().longitude | number: '1.6-6'
      }}</span>
    </div>
  </div>
</div>
